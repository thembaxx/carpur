name: Temporary Carpur Oxfmt diff
on:
  push:
    branches:
      - perf/studio-visibility-quality-oct30
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Display exact formatter adjustment
        run: |
          npx oxfmt --write src/lib/car-model.ts
          git diff -- src/lib/car-model.ts
