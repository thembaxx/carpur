name: One-time npm dependency refresh
on:
  push:
    branches:
      - chore/deps-latest-stable-20261022
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Refresh versions and verify lockfile
        run: |
          npx --yes npm-check-updates@23.1.1 -u --target latest
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit packages and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-dependency-refresh.yml
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): upgrade dependencies to latest stable'
            git push
          fi
