name: Carpur quality
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '19 6 * * 1'
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: node --experimental-strip-types scripts/check-navigation.mjs
      - run: node scripts/check-catalogue-freshness.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test actual keyboard navigation and responsive routes
        shell: bash
        run: |
          npm run start > "$RUNNER_TEMP/carpur-nav.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000 >/dev/null
          npm run check:shell
